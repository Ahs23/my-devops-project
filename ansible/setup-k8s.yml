---
- name: Configure DevOps EC2 Server with Kubernetes
  hosts: devops_server
  become: true
  gather_facts: yes

  vars:
    docker_version: "latest"
    kubectl_version: "1.28"
    k8s_manifests_dir: "/home/ec2-user/k8s"

  tasks:
    - name: Update system packages
      yum:
        name: "*"
        state: latest
      tags: system

    - name: Install required dependencies
      yum:
        name:
          - curl
          - wget
          - git
          - net-tools
          - jq
        state: present
      tags: dependencies

    - name: Ensure Docker is installed and running
      service:
        name: docker
        state: started
        enabled: true
      tags: docker

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes
      tags: docker

    - name: Install kubectl
      shell: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/
      args:
        creates: /usr/local/bin/kubectl
      tags: kubernetes

    - name: Verify kubectl installation
      command: kubectl version --client --short
      register: kubectl_version_output
      tags: kubernetes

    - name: Display kubectl version
      debug:
        msg: "{{ kubectl_version_output.stdout }}"
      tags: kubernetes

    - name: Install kubeadm
      yum:
        name:
          - kubeadm
          - kubelet
        state: present
        disable_gpg_check: yes
      ignore_errors: yes
      tags: kubernetes

    - name: Start kubelet service
      service:
        name: kubelet
        state: started
        enabled: true
      ignore_errors: yes
      tags: kubernetes

    - name: Check if Kubernetes cluster is initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf
      tags: kubernetes

    - name: Initialize Kubernetes cluster (if not already done)
      shell: |
        kubeadm init --pod-network-cidr=10.244.0.0/16 --ignore-preflight-errors=all
      when: not k8s_admin_conf.stat.exists
      ignore_errors: yes
      tags: kubernetes

    - name: Setup kubeconfig for ec2-user
      block:
        - name: Create .kube directory
          file:
            path: /home/ec2-user/.kube
            state: directory
            owner: ec2-user
            group: ec2-user
            mode: '0755'

        - name: Copy kubernetes admin config
          copy:
            src: /etc/kubernetes/admin.conf
            dest: /home/ec2-user/.kube/config
            owner: ec2-user
            group: ec2-user
            mode: '0600'
            remote_src: yes
          ignore_errors: yes

        - name: Untaint master node (for single-node cluster)
          shell: kubectl taint nodes --all node-role.kubernetes.io/control-plane- --kubeconfig=/home/ec2-user/.kube/config
          become_user: ec2-user
          ignore_errors: yes
      tags: kubernetes

    - name: Install Flannel CNI plugin
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/coreos/flannel/master/Documentation/kube-flannel.yml --kubeconfig=/home/ec2-user/.kube/config
      become_user: ec2-user
      ignore_errors: yes
      tags: kubernetes

    - name: Create k8s manifests directory
      file:
        path: "{{ k8s_manifests_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
      tags: kubernetes

    - name: Copy Kubernetes manifests
      copy:
        src: ../k8s/
        dest: "{{ k8s_manifests_dir }}/"
        owner: ec2-user
        group: ec2-user
      tags: kubernetes

    - name: Deploy application to Kubernetes
      shell: |
        cd {{ k8s_manifests_dir }}
        kubectl apply -f deployment.yml --kubeconfig=/home/ec2-user/.kube/config
        kubectl apply -f service.yml --kubeconfig=/home/ec2-user/.kube/config
        kubectl apply -f hpa.yml --kubeconfig=/home/ec2-user/.kube/config
      become_user: ec2-user
      register: k8s_deploy
      tags: kubernetes

    - name: Wait for deployment to be ready
      shell: |
        kubectl rollout status deployment/my-devops-app -n default --timeout=5m --kubeconfig=/home/ec2-user/.kube/config
      become_user: ec2-user
      ignore_errors: yes
      tags: kubernetes

    - name: Get deployment status
      shell: |
        kubectl get deployments -n default --kubeconfig=/home/ec2-user/.kube/config
        kubectl get pods -n default -l app=my-devops-app --kubeconfig=/home/ec2-user/.kube/config
        kubectl get svc -n default --kubeconfig=/home/ec2-user/.kube/config
      become_user: ec2-user
      register: k8s_status
      tags: kubernetes

    - name: Display deployment status
      debug:
        msg: "{{ k8s_status.stdout_lines }}"
      tags: kubernetes

    - name: Display deployment completion message
      debug:
        msg: "✓ Kubernetes cluster initialized and application deployed successfully!"
      tags: kubernetes

