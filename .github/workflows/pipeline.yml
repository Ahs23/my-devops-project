name: DevOps CI-CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            armanshaikh23/my-devops-app:latest
            armanshaikh23/my-devops-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          
          # Write private key safely
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/arman-devops-key
          chmod 600 ~/.ssh/arman-devops-key
          
          # Verify key was written
          if [ ! -f ~/.ssh/arman-devops-key ]; then
            echo "ERROR: SSH key file was not created!"
            exit 1
          fi
          
          # Create SSH config
          cat > ~/.ssh/config << 'EOF'
          Host *
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null
              IdentityFile ~/.ssh/arman-devops-key
          EOF
          
          chmod 600 ~/.ssh/config
          
          echo "✓ SSH key setup completed"
          ls -la ~/.ssh/

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible openssh-client

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          echo "=== Terraform Apply ==="
          terraform apply -auto-approve -input=false \
            -var "public_key=${{ secrets.EC2_PUBLIC_KEY }}" \
            -var "region=ap-south-1" \
            -var "instance_type=t3.micro"
          
          # Show outputs
          echo "=== Terraform Outputs ==="
          terraform output || true